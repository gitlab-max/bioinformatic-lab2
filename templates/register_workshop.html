{% extends "base.html" %}

{% block title %}Register for Workshop{% endblock %}

{% block content %}

<div class="container" style="max-width: 700px; margin: 40px auto;">

    <h1>🧪 Daily Bioinformatics Workshop</h1>
    <p class="text-muted">Join our free daily workshop to learn bioinformatics, RNA-seq, and AI in drug discovery.</p>

    <hr>

    <form method="POST" action="{{ url_for('main.register_workshop') }}">
        <!-- Name -->
        <div class="form-group mb-3">
            <label for="name">Full Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Your full name" required>
        </div>

        <!-- Email -->
        <div class="form-group mb-3">
            <label for="email">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <!-- Workshop Date (optional) -->
        <div class="form-group mb-3">
            <label for="date">Preferred Date</label>
            <select class="form-control" id="date" name="date">
                <option value="today">Today (10:00 AM UTC)</option>
                <option value="tomorrow">Tomorrow (10:00 AM UTC)</option>
                <option value="next_week">Next Week (10:00 AM UTC)</option>
            </select>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-success btn-lg">Register Now</button>
    </form>

    <div class="mt-4">
        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">← Back to Home</a>
    </div>

</div>

{% endblock %}
